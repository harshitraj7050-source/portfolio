<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Studio Portfolio — AI Filmmaker & Visual Artist</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#080808;--bg2:#121212;--ink:#f3efe8;--mute:#8d8b87;--gold:#c8a96a;--line:rgba(243,239,232,.12);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-behavior:smooth;scroll-padding-top:80px}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:Manrope,system-ui,-apple-system,Segoe UI,sans-serif;font-weight:300;line-height:1.6;overflow-x:hidden;-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:1px solid var(--gold);outline-offset:4px}
.wrap{padding:0 clamp(20px,5vw,72px)}
section{padding:clamp(80px,14vw,180px) 0;position:relative}
h1,h2,h3{font-weight:200;letter-spacing:-.02em;margin:0;line-height:1.02}
h1{font-size:clamp(44px,9vw,148px)}
h2{font-size:clamp(34px,6vw,92px)}
.eyebrow{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--gold);margin-bottom:28px;display:block}
p{color:var(--mute);max-width:56ch}
.rv{opacity:0;transform:translateY(40px);transition:opacity 1.1s cubic-bezier(.2,.7,.2,1),transform 1.1s cubic-bezier(.2,.7,.2,1)}
.rv.in{opacity:1;transform:none}
/* nav */
nav{position:fixed;top:env(safe-area-inset-top,0px);left:0;right:0;z-index:50;display:flex;justify-content:space-between;align-items:center;padding:22px clamp(20px,5vw,72px);transition:background .5s,backdrop-filter .5s}
nav.solid{background:rgba(8,8,8,.78);backdrop-filter:blur(14px)}
.logo{font-size:13px;letter-spacing:.4em;font-weight:400}
.links{display:flex;gap:36px}
.links a{font-size:11px;letter-spacing:.24em;text-transform:uppercase;position:relative;padding:4px 0}
.links a::after{content:"";position:absolute;left:0;bottom:0;height:1px;width:100%;background:var(--gold);transform:scaleX(0);transform-origin:left;transition:transform .5s}
.links a:hover::after{transform:scaleX(1)}
.burger{display:none;background:none;border:0;padding:8px}
.burger i{display:block;width:26px;height:1px;background:var(--ink);margin:7px 0}
@media(max-width:860px){.burger{display:block}.links{position:fixed;inset:0;background:var(--bg);flex-direction:column;justify-content:center;align-items:center;gap:30px;opacity:0;pointer-events:none;transition:opacity .5s}.links.open{opacity:1;pointer-events:auto}.links a{font-size:18px}.burger{position:relative;z-index:60}}
/* hero */
.hero{min-height:100vh;min-height:100svh;display:flex;flex-direction:column;justify-content:flex-end;padding:0 0 clamp(60px,9vw,110px);overflow:hidden}
.hero-bg{position:absolute;inset:0;z-index:0;background:radial-gradient(60% 50% at 70% 35%,rgba(200,169,106,.28),transparent 70%),radial-gradient(50% 60% at 15% 80%,rgba(70,90,120,.35),transparent 70%),#0b0b0c;animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.12) translate(-2%,1%)}}
.hero-bg video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.hero::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(8,8,8,.35),rgba(8,8,8,.1) 40%,rgba(8,8,8,.92));z-index:1}
.grain{position:fixed;inset:-50%;z-index:40;pointer-events:none;opacity:.07;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='160' height='160'><filter id='n'><feTurbulence baseFrequency='.9' numOctaves='2'/></filter><rect width='160' height='160' filter='url(%23n)'/></svg>");animation:gr 1s steps(4) infinite}
@keyframes gr{25%{transform:translate(-3%,2%)}50%{transform:translate(2%,-3%)}75%{transform:translate(-2%,-1%)}}
.hero .wrap{position:relative;z-index:2}
.hero p{font-size:clamp(14px,1.4vw,18px);margin:32px 0 44px;color:#bdb9b2}
.ctas{display:flex;gap:16px;flex-wrap:wrap}
.btn{display:inline-block;padding:17px 34px;font-size:11px;letter-spacing:.26em;text-transform:uppercase;border:1px solid var(--ink);background:transparent;transition:background .5s,color .5s,border-color .5s}
.btn:hover{background:var(--ink);color:var(--bg)}
.btn.gold{border-color:var(--gold);color:var(--gold)}
.btn.gold:hover{background:var(--gold);color:var(--bg)}
.scroll{position:absolute;right:clamp(20px,5vw,72px);bottom:44px;z-index:2;font-size:10px;letter-spacing:.3em;writing-mode:vertical-rl;color:var(--mute);display:flex;align-items:center;gap:14px}
.scroll i{width:1px;height:60px;background:linear-gradient(var(--gold),transparent);animation:sc 2.2s ease-in-out infinite}
@keyframes sc{0%{transform:scaleY(0);transform-origin:top}50%{transform:scaleY(1);transform-origin:top}51%{transform-origin:bottom}100%{transform:scaleY(0);transform-origin:bottom}}
/* work */
.filters{display:flex;gap:10px 30px;flex-wrap:wrap;margin:48px 0 56px}
.filters button{background:none;border:0;padding:6px 0;font-size:11px;letter-spacing:.22em;text-transform:uppercase;color:var(--mute);border-bottom:1px solid transparent;transition:color .4s,border-color .4s}
.filters button:hover,.filters button.on{color:var(--ink);border-color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:clamp(20px,3vw,44px)}
.card{grid-column:span 6;text-align:left;background:none;border:0;padding:0;display:block;width:100%}
.card:nth-child(5n+1){grid-column:span 8}.card:nth-child(5n+2){grid-column:span 4}
@media(max-width:860px){.card,.card:nth-child(n){grid-column:span 12}}
.thumb{position:relative;aspect-ratio:16/9;overflow:hidden;background:var(--bg2)}
.card:nth-child(5n+2) .thumb{aspect-ratio:4/5}
.art{position:absolute;inset:0;transition:transform 1.4s cubic-bezier(.2,.7,.2,1),filter .8s;filter:saturate(.85)}
.card:hover .art,.card:focus-visible .art{transform:scale(1.07);filter:saturate(1.15)}
.thumb::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 50%,rgba(0,0,0,.55))}
.play{position:absolute;left:50%;top:50%;z-index:2;width:76px;height:76px;margin:-38px;border:1px solid rgba(243,239,232,.7);border-radius:50%;display:grid;place-items:center;opacity:0;transform:scale(.7);transition:.6s cubic-bezier(.2,.7,.2,1);backdrop-filter:blur(6px)}
.card:hover .play,.card:focus-visible .play{opacity:1;transform:none}
.play svg{width:20px;margin-left:3px}
.meta{display:flex;justify-content:space-between;gap:20px;padding-top:20px;align-items:baseline}
.meta h3{font-size:clamp(20px,2vw,28px);font-weight:300}
.meta span{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--gold);white-space:nowrap}
.card p{margin:8px 0 0;font-size:14px}
/* showreel */
.reel{background:var(--bg2);text-align:center}
.reel p{margin:26px auto 60px}
.reelbox{position:relative;aspect-ratio:21/9;min-height:240px;overflow:hidden;cursor:pointer;border:0;padding:0;width:100%;display:block}
.reelbox .play{opacity:1;transform:none;width:110px;height:110px;margin:-55px;transition:.6s}
.reelbox:hover .play{background:var(--ink);color:var(--bg);border-color:var(--ink)}
/* about */
.about{display:grid;grid-template-columns:1fr 1fr;gap:clamp(32px,7vw,120px);align-items:center}
.portrait{aspect-ratio:4/5;position:relative;overflow:hidden;background:var(--bg2)}
.about p+p{margin-top:20px}
@media(max-width:860px){.about{grid-template-columns:1fr}}
/* services */
.svc{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);margin-top:70px;border:1px solid var(--line)}
@media(max-width:1000px){.svc{grid-template-columns:repeat(2,1fr)}}@media(max-width:600px){.svc{grid-template-columns:1fr}}
.s{background:var(--bg);padding:clamp(28px,3.5vw,52px);transition:background .6s,transform .6s}
.s:hover{background:#101010}
.s svg{width:34px;height:34px;stroke:var(--gold);fill:none;stroke-width:1;margin-bottom:56px;transition:transform .6s}
.s:hover svg{transform:translateY(-6px)}
.s h3{font-size:22px;font-weight:300;margin-bottom:12px;letter-spacing:0}
.s p{font-size:14px;margin:0}
/* process */
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:40px;margin-top:80px}
@media(max-width:900px){.steps{grid-template-columns:1fr 1fr}}@media(max-width:560px){.steps{grid-template-columns:1fr}}
.step{border-top:1px solid var(--line);padding-top:26px}
.step b{display:block;font-weight:200;font-size:56px;color:var(--gold);line-height:1;margin-bottom:26px}
.step h3{font-size:20px;font-weight:400;margin-bottom:10px;letter-spacing:0}
.step p{font-size:14px;margin:0}
/* contact */
.contact{text-align:center;background:radial-gradient(50% 50% at 50% 100%,rgba(200,169,106,.12),transparent 70%)}
.contact p{margin:28px auto 44px}
.social{display:flex;gap:18px;justify-content:center;flex-wrap:wrap;margin-bottom:80px}
form{max-width:640px;margin:0 auto;text-align:left;display:grid;gap:30px}
label{font-size:10px;letter-spacing:.26em;text-transform:uppercase;color:var(--mute);display:block}
input,textarea{width:100%;background:none;border:0;border-bottom:1px solid var(--line);color:var(--ink);font:inherit;font-size:17px;padding:12px 0;border-radius:0;transition:border-color .4s}
input:focus,textarea:focus{outline:none;border-color:var(--gold)}
textarea{resize:vertical;min-height:110px}
.ok{color:var(--gold);font-size:13px;min-height:20px}
footer{border-top:1px solid var(--line);padding:56px 0 44px}
.f{display:flex;justify-content:space-between;gap:32px;flex-wrap:wrap;align-items:flex-start}
.f nav,.f .fl{position:static;padding:0;display:flex;gap:22px;flex-wrap:wrap;background:none}
.f a{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mute);transition:color .4s}
.f a:hover{color:var(--gold)}
.sm{font-size:12px;color:var(--mute);margin-top:48px;display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
/* modal */
.modal{position:fixed;inset:0;z-index:100;background:rgba(5,5,5,.94);display:grid;place-items:center;padding:clamp(16px,4vw,64px);animation:fi .5s}
@keyframes fi{from{opacity:0}}
.mbox{width:min(1200px,100%)}
.mv{aspect-ratio:16/9;background:#000;position:relative;display:grid;place-items:center;text-align:center;overflow:hidden}
.mv video{width:100%;height:100%}
.mv .ph{padding:24px;color:var(--mute);font-size:13px;position:relative;z-index:1}
.mt{display:flex;justify-content:space-between;padding-top:18px;gap:20px}
.x{position:fixed;top:calc(18px + env(safe-area-inset-top,0px));right:22px;background:none;border:0;font-size:11px;letter-spacing:.3em;z-index:101;padding:8px}
/* cursor */
.cur{position:fixed;left:0;top:0;width:36px;height:36px;margin:-18px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;z-index:200;transition:width .35s,height .35s,margin .35s,background .35s,opacity .3s;opacity:0}
.cur.big{width:72px;height:72px;margin:-36px;background:rgba(200,169,106,.12)}
@media(hover:none){.cur{display:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv{opacity:1;transform:none}html{scroll-behavior:auto}}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js"></script>
<script>
/* ============ EDIT YOUR CONTENT HERE ============ */
const BRAND = "YOUR NAME";
const EMAIL = "hello@yourname.com";
const INSTAGRAM = "https://instagram.com/yourhandle";
const LINKEDIN = "https://linkedin.com/in/yourhandle";
const HERO_VIDEO = "";            // e.g. "https://…/hero.mp4" (muted loop plays behind headline)
const SHOWREEL = {src:"", poster:""}; // your showreel mp4 URL
const CATEGORIES = ["All","AI Commercials","Luxury Product Films","Cinematic Storytelling","Fashion & Lifestyle","Experimental AI Films"];
// src = video file URL (mp4/webm). poster = optional image URL. c1/c2 = placeholder colours.
const PROJECTS = [
 {title:"Obsidian Hour",cat:"Luxury Product Films",desc:"A watch film shot entirely in imagined light.",src:"",poster:"",c1:"#c8a96a",c2:"#1b1410"},
 {title:"Velvet Static",cat:"Fashion & Lifestyle",desc:"Couture in motion, between dream and campaign.",src:"",poster:"",c1:"#8a4b5e",c2:"#120c10"},
 {title:"The Last Aurora",cat:"Cinematic Storytelling",desc:"A short about the final night of a polar town.",src:"",poster:"",c1:"#3f7f8f",c2:"#07131a"},
 {title:"Halo No. 9",cat:"AI Commercials",desc:"A fragrance spot built from liquid architecture.",src:"",poster:"",c1:"#d9d2c3",c2:"#18181a"},
 {title:"Echo Garden",cat:"Experimental AI Films",desc:"Generative landscapes that remember you.",src:"",poster:"",c1:"#5f8f5a",c2:"#0b140c"},
 {title:"Monolith",cat:"AI Commercials",desc:"Automotive launch film, no camera required.",src:"",poster:"",c1:"#7a8696",c2:"#0c0e12"}
];
/* ================================================= */
const h = React.createElement, {useState,useEffect,useRef} = React;
const NAV = ["Home","Work","About","Services","Contact"];
const ID = {Home:"home",Work:"work",About:"about",Services:"services",Contact:"contact"};
const art = p => ({background:(p.poster?`url(${p.poster}) center/cover,`:"")+`radial-gradient(70% 60% at 70% 30%,${p.c1}99,transparent 70%),radial-gradient(60% 70% at 10% 90%,${p.c1}44,transparent 70%),${p.c2}`});
const Play = () => h("svg",{viewBox:"0 0 24 24",fill:"currentColor","aria-hidden":true},h("path",{d:"M6 3l15 9-15 9z"}));

function Reveal({children,tag="div",className="",delay=0,...r}){
  const ref=useRef();
  useEffect(()=>{const o=new IntersectionObserver(e=>e.forEach(x=>{if(x.isIntersecting){x.target.classList.add("in");o.unobserve(x.target)}}),{threshold:.12});o.observe(ref.current);return()=>o.disconnect()},[]);
  return h(tag,{ref,className:"rv "+className,style:{transitionDelay:delay+"ms"},...r},children);
}
function Nav(){
  const [solid,setS]=useState(false),[open,setO]=useState(false);
  useEffect(()=>{const f=()=>setS(scrollY>60);f();addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  return h("nav",{className:solid?"solid":""},
    h("a",{href:"#home",className:"logo"},BRAND),
    h("button",{className:"burger","aria-label":"Menu","aria-expanded":open,onClick:()=>setO(!open)},h("i"),h("i")),
    h("div",{className:"links"+(open?" open":"")},NAV.map(n=>h("a",{key:n,href:"#"+ID[n],onClick:()=>setO(false)},n))));
}
function Hero(){
  const bg=useRef();
  useEffect(()=>{const f=()=>{if(bg.current)bg.current.style.transform=`translateY(${scrollY*.25}px)`};addEventListener("scroll",f,{passive:true});return()=>removeEventListener("scroll",f)},[]);
  return h("header",{id:"home",className:"hero"},
    h("div",{className:"hero-bg",ref:bg},HERO_VIDEO&&h("video",{src:HERO_VIDEO,autoPlay:true,muted:true,loop:true,playsInline:true,preload:"metadata"})),
    h("div",{className:"wrap"},
      h("span",{className:"eyebrow"},"AI Filmmaker · Visual Artist"),
      h("h1",null,"IMAGINING WHAT",h("br"),"DOESN’T EXIST."),
      h("p",null,"AI Filmmaker & Visual Artist crafting cinematic visuals, imaginative worlds, and unforgettable brand experiences."),
      h("div",{className:"ctas"},h("a",{className:"btn",href:"#work"},"Explore my work"),h("a",{className:"btn gold",href:"#contact"},"Let’s collaborate"))),
    h("div",{className:"scroll","aria-hidden":true},"SCROLL",h("i")));
}
function Work({open}){
  const [f,setF]=useState("All");
  const list=PROJECTS.filter(p=>f==="All"||p.cat===f);
  return h("section",{id:"work"},h("div",{className:"wrap"},
    h(Reveal,null,h("span",{className:"eyebrow"},"Selected Work"),h("h2",null,"THE COLLECTION")),
    h("div",{className:"filters",role:"tablist"},CATEGORIES.map(c=>h("button",{key:c,className:f===c?"on":"",onClick:()=>setF(c)},c))),
    h("div",{className:"grid"},list.map((p,i)=>h(Reveal,{key:p.title,tag:"button",className:"card","data-hover":1,delay:i*70,"aria-label":"Play "+p.title,onClick:()=>open(p)},
      h("div",{className:"thumb"},h("div",{className:"art",style:art(p)}),h("div",{className:"play"},h(Play))),
      h("div",{className:"meta"},h("h3",null,p.title),h("span",null,p.cat)),
      h("p",null,p.desc))))));
}
function Reel({open}){
  const p={title:"Showreel",cat:"2026 Reel",...SHOWREEL,c1:"#c8a96a",c2:"#0d0d0e"};
  return h("section",{className:"reel"},h("div",{className:"wrap"},
    h(Reveal,null,h("span",{className:"eyebrow"},"Showreel"),h("h2",null,"VISIONS, BROUGHT TO LIFE."),
      h("p",null,"A collection of visual experiments, AI-powered storytelling, and cinematic creations.")),
    h(Reveal,{tag:"button",className:"reelbox thumb","data-hover":1,"aria-label":"Play showreel",onClick:()=>open(p)},
      h("div",{className:"art",style:art(p)}),h("div",{className:"play"},h(Play)))));
}
function About(){
  return h("section",{id:"about"},h("div",{className:"wrap about"},
    h(Reveal,{className:"portrait"},h("div",{className:"art",style:{background:"radial-gradient(60% 45% at 50% 35%,#c8a96a88,transparent 70%),radial-gradient(80% 60% at 50% 100%,#2a3340,transparent 70%),#0c0c0d"}})),
    h(Reveal,{delay:150},h("span",{className:"eyebrow"},"About"),h("h2",{style:{marginBottom:36}},"CREATIVITY MEETS TECHNOLOGY."),
      h("p",null,"I’m an aspiring AI filmmaker and visual creator passionate about combining artificial intelligence, cinematic storytelling, and creative experimentation to produce visually compelling experiences."),
      h("p",null,"I explore the intersection of technology and filmmaking to transform imagination into moving visuals."))));
}
const ICONS={
 film:"M3 5h18v14H3zM7 5v14M17 5v14M3 9h4M3 15h4M17 9h4M17 15h4",
 box:"M12 3l8 4.5v9L12 21l-8-4.5v-9zM12 12l8-4.5M12 12v9M12 12L4 7.5",
 cam:"M3 7h13v10H3zM16 11l5-3v8l-5-3",
 spark:"M12 3v6M12 15v6M3 12h6M15 12h6M6 6l3 3M15 15l3 3M18 6l-3 3M9 15l-3 3",
 bulb:"M9 18h6M10 21h4M12 3a6 6 0 0 0-4 10.5V16h8v-2.5A6 6 0 0 0 12 3z",
 phone:"M8 2h8v20H8zM11 19h2"};
const SERVICES=[["film","AI Video Commercials","Concept-to-screen spots that sell a feeling before a product."],["box","Product Advertisement Films","Hero product visuals with impossible lighting and motion."],["cam","Cinematic Brand Films","Longer-form storytelling that gives a brand its own world."],["spark","AI Visual Storytelling","Narrative sequences with a consistent look, cast and tone."],["bulb","Creative Video Concepts","Treatments, mood films and storyboards to align on vision."],["phone","Social Media Video Content","Vertical, scroll-stopping cuts built for every platform."]];
function Services(){
  return h("section",{id:"services"},h("div",{className:"wrap"},
    h(Reveal,null,h("span",{className:"eyebrow"},"Services"),h("h2",null,"WHAT I CREATE.")),
    h("div",{className:"svc"},SERVICES.map(([i,t,d],k)=>h(Reveal,{key:t,className:"s",delay:k*60},
      h("svg",{viewBox:"0 0 24 24","aria-hidden":true},h("path",{d:ICONS[i]})),h("h3",null,t),h("p",null,d))))));
}
const STEPS=[["Concept & Research","Understanding the vision, brand identity, and creative direction."],["Visual Development","Creating concepts, storyboards, and AI-generated visual assets."],["Production & Editing","Generating video sequences, refining motion, and editing the final film."],["Final Delivery","Delivering polished, cinematic content ready for publication."]];
function Process(){
  return h("section",{style:{background:"var(--bg2)"}},h("div",{className:"wrap"},
    h(Reveal,null,h("span",{className:"eyebrow"},"Creative Process"),h("h2",null,"FROM IDEA TO FILM.")),
    h("div",{className:"steps"},STEPS.map(([t,d],i)=>h(Reveal,{key:t,className:"step",delay:i*100},h("b",null,"0"+(i+1)),h("h3",null,t),h("p",null,d))))));
}
function Contact(){
  const [msg,setMsg]=useState("");
  const submit=e=>{e.preventDefault();const d=new FormData(e.target);
    const body=`${d.get("msg")}\n\n— ${d.get("name")} (${d.get("email")})`;
    location.href=`mailto:${EMAIL}?subject=${encodeURIComponent("Project enquiry from "+d.get("name"))}&body=${encodeURIComponent(body)}`;
    setMsg("Thank you — your email app should open with the message ready to send.");e.target.reset()};
  return h("section",{id:"contact",className:"contact"},h("div",{className:"wrap"},
    h(Reveal,null,h("span",{className:"eyebrow"},"Contact"),h("h2",null,"HAVE A VISION?",h("br"),"LET’S CREATE IT."),
      h("p",null,"Open to creative collaborations, freelance projects, and exciting opportunities.")),
    h(Reveal,{className:"social"},h("a",{className:"btn gold",href:"mailto:"+EMAIL},"Email me"),
      h("a",{className:"btn",href:INSTAGRAM,target:"_blank",rel:"noopener"},"Instagram"),
      h("a",{className:"btn",href:LINKEDIN,target:"_blank",rel:"noopener"},"LinkedIn")),
    h(Reveal,{tag:"form",onSubmit:submit},
      h("div",null,h("label",{htmlFor:"n"},"Name"),h("input",{id:"n",name:"name",required:true,autoComplete:"name"})),
      h("div",null,h("label",{htmlFor:"e"},"Email"),h("input",{id:"e",name:"email",type:"email",required:true,autoComplete:"email"})),
